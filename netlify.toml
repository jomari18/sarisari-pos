# Netlify serves the web app and proxies /api to the API on Render (spec 4 and 14). PROXY_SIGNING_SECRET is set in
# Netlify's site settings (runtime scope), never here; it signs every proxied request. The API runs on Render at
# zarizari-api.onrender.com.

[build]
  # From the workspace root, so npm installs the shared package with the app.
  command = "npm run build -w @sari/web"
  publish = "apps/web/dist"

[build.environment]
  # The landing page wakes the sleeping API directly, without the proxy's 26-second limit.
  VITE_API_WAKE_URL = "https://zarizari-api.onrender.com/api/health"

# Every API call goes to Render through Netlify, which signs it so the API knows where it came from.
[[redirects]]
  from = "/api/*"
  to = "https://zarizari-api.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "PROXY_SIGNING_SECRET"

# Every other address is a page of the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The free plan's "Powered by Netlify" badge draws in a srcdoc iframe that inherits this policy. Its one inline
# script is allowed by its hash (if Netlify changes the badge, the console names the new hash), and its card's
# form opens app.netlify.com. Nothing else inline may run.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-BkKP2XO6WOEc3kXOiLr2ZoY83hamalKjPY9xBcbXVuw='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://zarizari-api.onrender.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://app.netlify.com"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite names these files after their content, so a file never changes and browsers may keep it for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
