name: Clean up demo stores

# Spec 8.1: demo stores live for 24 hours; this deletes the expired ones every day.
on:
  schedule:
    # 03:00 in Manila (UTC+8).
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    name: Delete expired demo stores
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing to clean until the site is live and its two addresses are set as repository variables.
    if: vars.SITE_URL != '' && vars.API_URL != ''
    steps:
      # The free Render instance sleeps; the proxy below gives up after 26 seconds, waking takes about a minute.
      - name: Wake the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors --max-time 90 "$API_URL/api/health"
      # Through Netlify, which signs the request; the secret header shows it is this job.
      - name: Delete expired demo stores
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CLEANUP_SECRET: ${{ secrets.CLEANUP_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 15 --retry-all-errors --max-time 30 \
            -X POST -H "x-cleanup-secret: $CLEANUP_SECRET" "$SITE_URL/api/admin/cleanup"
