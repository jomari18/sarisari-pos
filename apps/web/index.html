<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ZariZari</title>
    <meta name="description" content="ZariZari is a point of sale for the neighborhood sari-sari store: sell by search or barcode, keep the utang list, count the stock and keep selling offline. Open a demo store in one click." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#111315" />
    <!-- The card a link to the site shows when it is shared (spec 11.5); %SITE_URL% is the site's address. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZariZari" />
    <meta property="og:title" content="ZariZari" />
    <meta property="og:description" content="The point of sale for the neighborhood sari-sari store. Try a demo store, no sign-up." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A sari-sari store at dusk under the ZariZari sign, beside the words: the point of sale for the neighborhood sari-sari store." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Applies a saved theme before the first paint (a file, not inline, so the strict CSP allows it). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
